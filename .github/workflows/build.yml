name: Build and Auto-Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version Bump Type (patch / minor / major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # すべてのタグと履歴を取得

      - name: Determine Next Version
        id: semver
        shell: pwsh
        run: |
          # 既存の v* タグ一覧を取得（バージョン順にソート）
          $tags = git tag -l "v*" --sort=v:refname
          $latest = $tags | Select-Object -Last 1

          $bumpType = "${{ github.event.inputs.bump }}"
          if ([string]::IsNullOrWhiteSpace($bumpType)) {
            $bumpType = "patch"
          }

          if (-not $latest) {
            $nextTag = "v0.0.1"
            Write-Host "No existing tag found. Starting at $nextTag"
          } else {
            Write-Host "Latest tag found: $latest"
            if ($latest -match '^v?(\d+)\.(\d+)\.(\d+)$') {
              $major = [int]$matches[1]
              $minor = [int]$matches[2]
              $patch = [int]$matches[3]

              switch ($bumpType) {
                "major" { $major++; $minor = 0; $patch = 0 }
                "minor" { $minor++; $patch = 0 }
                default { $patch++ }
              }

              $nextTag = "v$major.$minor.$patch"
            } else {
              $nextTag = "v0.0.1"
            }
          }

          Write-Host "Next release tag: $nextTag"
          echo "tag=$nextTag" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Standalone EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --clean --name "X3D-Thread-Inspector" ccd_monitor.py

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $tag = "${{ steps.semver.outputs.tag }}"
          $pkgDir = "X3D-Thread-Inspector-$tag"
          New-Item -ItemType Directory -Path $pkgDir
          Copy-Item dist\X3D-Thread-Inspector.exe $pkgDir\
          Copy-Item README.md $pkgDir\
          Copy-Item README.ja.md $pkgDir\
          Copy-Item LICENSE $pkgDir\
          Copy-Item assets $pkgDir\ -Recurse
          Compress-Archive -Path $pkgDir -DestinationPath "$pkgDir.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: Release ${{ steps.semver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/X3D-Thread-Inspector.exe
            X3D-Thread-Inspector-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
