name: Build Standalone Windows EXE

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build standalone EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --clean --name "X3D-Thread-Inspector" ccd_monitor.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: X3D-Thread-Inspector-Windows
          path: dist/X3D-Thread-Inspector.exe
          retention-days: 14

      - name: Package Release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkgDir = "X3D-Thread-Inspector-$tag"
          New-Item -ItemType Directory -Path $pkgDir
          Copy-Item dist\X3D-Thread-Inspector.exe $pkgDir\
          Copy-Item README.md $pkgDir\
          Copy-Item LICENSE $pkgDir\
          Compress-Archive -Path $pkgDir -DestinationPath "$pkgDir.zip"

      - name: Release Assets (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/X3D-Thread-Inspector.exe
            X3D-Thread-Inspector-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
